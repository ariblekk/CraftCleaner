[package]
name = "cleaner"
version = "1.0.0"
edition = "2021"
description = "A system cleaner: finds and removes temporary and junk files."

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.32"
egui-phosphor = "0.10"
egui_animation = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
